[project]
name = "acthermal_tumor"
version = "0.2.0"
description = "A non-isothermal Allen-Cahn tumor growth simulator using JAX and exponax"
authors = [
  { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" }
]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<4"
license = { text = "MIT" }

dependencies = [
  "jax>=0.4.20,<0.5",
  "jaxlib>=0.4.20,<0.5",
  "exponax>=0.2.0",
  "numpy>=1.23",
  "matplotlib>=3.6"
]

[project.urls]
Homepage = "https://github.com/bibymaths/acthermal_tumor"
Repository = "https://github.com/bibymaths/acthermal_tumor"
Tracker = "https://github.com/bibymaths/acthermal_tumor/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
]
lint = [
  "ruff>=0.4.0",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
]
lint = [
  "ruff>=0.4.0",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/assets",
  "/examples",
  "/tests"
]

[tool.hatch.build.targets.wheel]
packages = ["src/acthermal_tumor"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "N",   # pep8-naming
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=src/acthermal_tumor",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=70",
]

[tool.coverage.run]
source = ["src/acthermal_tumor"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
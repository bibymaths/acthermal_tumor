[project]
name = "acthermal_tumor"
version = "0.1.0"
description = "A non‑isothermal Allen–Cahn tumor growth simulator using JAX and exponax"
authors = [
{ name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<4"
license = { text = "MIT" }

dependencies = [
"jax>=0.4.20,<0.5",
"jaxlib>=0.4.20,<0.5",
"exponax>=0.2.0",
"numpy>=1.23",
"matplotlib>=3.6"
]

[project.optional-dependencies]
# Development dependencies.  These are not required to run the
# simulator but are useful for running the included test suite.
dev = [
"pytest>=7.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"